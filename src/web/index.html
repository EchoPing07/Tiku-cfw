<!DOCTYPE html>
<html lang="zh-CN" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiku-cfw 管理面板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['system-ui','-apple-system','sans-serif'], mono: ['ui-monospace','SFMono-Regular','monospace'] } } }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-feature-settings: "kern"; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    .dark ::-webkit-scrollbar-thumb { background: #4b5563; }
    .theme-transition, .theme-transition * { transition: background-color .2s, border-color .2s, color .2s; }
    .page-enter { animation: pageEnter .15s ease-out; }
    @keyframes pageEnter { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
    .overlay-enter { animation: overlayEnter .2s ease-out; }
    @keyframes overlayEnter { from{opacity:0} to{opacity:1} }
    .sidebar-enter { animation: sidebarEnter .2s ease-out; }
    @keyframes sidebarEnter { from{transform:translateX(-100%)} to{transform:translateX(0)} }
    input:focus,select:focus,textarea:focus { outline:none; }
    input[type="checkbox"] { accent-color:#111827; }
    .dark input[type="checkbox"] { accent-color:#f3f4f6; }
  </style>
</head>
<body class="bg-white dark:bg-neutral-950 text-gray-900 dark:text-gray-100 theme-transition min-h-screen">

<!-- ==================== 登录页 ==================== -->
<div id="page-login" class="hidden min-h-screen flex items-center justify-center px-4 relative">
  <button onclick="toggleTheme()" class="fixed top-4 right-4 z-50 w-9 h-9 flex items-center justify-center border border-gray-300 dark:border-gray-700 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:border-gray-400 dark:hover:border-gray-600 transition-colors">
    <svg class="theme-icon-light w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg class="theme-icon-dark w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
  <div class="w-full max-w-sm">
    <div class="mb-10 text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 border border-gray-300 dark:border-gray-700 rounded-lg mb-4">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-gray-700 dark:text-gray-300"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>
      </div>
      <h1 class="text-xl font-semibold tracking-tight">Tiku-cfw</h1>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">题库管理面板</p>
    </div>
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1.5">密码</label>
        <input type="password" id="login-password" placeholder="请输入管理密码" class="w-full px-3.5 py-2.5 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm focus:border-gray-900 dark:focus:border-gray-100 transition-colors">
      </div>
      <button type="submit" class="w-full py-2.5 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 rounded-lg text-sm font-medium hover:bg-gray-700 dark:hover:bg-gray-300 transition-colors">登录</button>
    </form>
  </div>
</div>

<!-- ==================== 主布局 ==================== -->
<div id="app-main" class="hidden">
  <div id="mobile-overlay" class="hidden fixed inset-0 bg-black/40 z-30 overlay-enter md:hidden" onclick="closeSidebar()"></div>
  <aside id="sidebar" class="fixed left-0 top-0 bottom-0 w-56 border-r border-gray-200 dark:border-gray-800 bg-white dark:bg-neutral-950 z-40 flex flex-col sidebar-enter md:translate-x-0 md:z-auto transition-transform">
    <div class="h-14 flex items-center px-5 border-b border-gray-200 dark:border-gray-800 shrink-0">
      <div class="inline-flex items-center justify-center w-7 h-7 border border-gray-300 dark:border-gray-700 rounded mr-2.5">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-700 dark:text-gray-300"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>
      </div>
      <span class="text-sm font-semibold tracking-tight">Tiku-cfw</span>
    </div>
    <nav class="flex-1 overflow-y-auto py-3 px-2.5 space-y-0.5">
      <a href="#/dashboard" class="nav-item flex items-center px-3 py-2 rounded-md text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-900 hover:text-gray-900 dark:hover:text-gray-100 transition-colors" data-route="dashboard"><svg class="w-4 h-4 mr-2.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>仪表盘</span></a>
      <a href="#/questions" class="nav-item flex items-center px-3 py-2 rounded-md text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-900 hover:text-gray-900 dark:hover:text-gray-100 transition-colors" data-route="questions"><svg class="w-4 h-4 mr-2.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg><span>题库管理</span></a>
      <a href="#/keys" class="nav-item flex items-center px-3 py-2 rounded-md text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-900 hover:text-gray-900 dark:hover:text-gray-100 transition-colors" data-route="keys"><svg class="w-4 h-4 mr-2.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg><span>API 密钥</span></a>
      <a href="#/channels" class="nav-item flex items-center px-3 py-2 rounded-md text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-900 hover:text-gray-900 dark:hover:text-gray-100 transition-colors" data-route="channels"><svg class="w-4 h-4 mr-2.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg><span>AI 渠道</span></a>
      <a href="#/logs" class="nav-item flex items-center px-3 py-2 rounded-md text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-900 hover:text-gray-900 dark:hover:text-gray-100 transition-colors" data-route="logs"><svg class="w-4 h-4 mr-2.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18M3 12h18M3 18h18"/></svg><span>搜索日志</span></a>
      <a href="#/settings" class="nav-item flex items-center px-3 py-2 rounded-md text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-900 hover:text-gray-900 dark:hover:text-gray-100 transition-colors" data-route="settings"><svg class="w-4 h-4 mr-2.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>系统设置</span></a>
    </nav>
    <div class="p-3 border-t border-gray-200 dark:border-gray-800 shrink-0 space-y-1">
      <button onclick="toggleTheme()" class="w-full flex items-center px-3 py-2 rounded-md text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-900 transition-colors">
        <svg class="theme-icon-light w-4 h-4 mr-2.5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="theme-icon-dark w-4 h-4 mr-2.5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span class="theme-text-light">浅色模式</span><span class="theme-text-dark hidden">深色模式</span>
      </button>
      <button onclick="logout()" class="w-full flex items-center px-3 py-2 rounded-md text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-900 transition-colors"><svg class="w-4 h-4 mr-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>退出登录</span></button>
    </div>
  </aside>
  <div class="md:ml-56">
    <header class="h-14 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-4 md:px-6 sticky top-0 bg-white dark:bg-neutral-950 z-20">
      <div class="flex items-center gap-3">
        <button onclick="openSidebar()" class="md:hidden text-gray-600 dark:text-gray-400"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <h2 id="page-title" class="text-sm font-medium">仪表盘</h2>
      </div>
      <div class="flex items-center gap-3"><span class="text-xs text-gray-400 hidden sm:inline">v1.0.0</span><div class="w-7 h-7 border border-gray-300 dark:border-gray-700 rounded-full flex items-center justify-center"><svg class="w-3.5 h-3.5 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div></div>
    </header>
    <main id="page-content" class="p-4 md:p-6 max-w-6xl mx-auto"></main>
  </div>
</div>

<div id="modal-container"></div>
<div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

<script>
// ============================================================
// API 封装
// ============================================================
const API = {
  async request(path, options = {}) {
    const token = localStorage.getItem('tiku-token');
    const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(path, { ...options, headers });
    if (res.status === 401) { logout(); throw new Error('登录已过期'); }
    return res.json();
  },
  get(path) { return this.request(path); },
  post(path, data) { return this.request(path, { method: 'POST', body: JSON.stringify(data) }); },
  put(path, data) { return this.request(path, { method: 'PUT', body: JSON.stringify(data) }); },
  del(path) { return this.request(path, { method: 'DELETE' }); },
};

// ============================================================
// 主题管理
// ============================================================
function getStoredTheme(){return localStorage.getItem('tiku-theme')||'auto';}
function applyTheme(t){const d=t==='dark'||(t==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);document.querySelectorAll('.theme-icon-light').forEach(e=>e.classList.toggle('hidden',!d));document.querySelectorAll('.theme-icon-dark').forEach(e=>e.classList.toggle('hidden',d));document.querySelectorAll('.theme-text-light').forEach(e=>e.classList.toggle('hidden',!d));document.querySelectorAll('.theme-text-dark').forEach(e=>e.classList.toggle('hidden',!d));}
function toggleTheme(){const c=getStoredTheme();const d=document.documentElement.classList.contains('dark');const n=d?'light':'dark';localStorage.setItem('tiku-theme',n);applyTheme(n);}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(getStoredTheme()==='auto')applyTheme('auto');});
applyTheme(getStoredTheme());

// ============================================================
// 路由
// ============================================================
const routes=['dashboard','questions','keys','channels','logs','settings'];
const routeTitles={dashboard:'仪表盘',questions:'题库管理',keys:'API 密钥',channels:'AI 渠道',logs:'搜索日志',settings:'系统设置'};
function navigate(){const hash=location.hash.slice(2)||'dashboard';const route=routes.includes(hash)?hash:'dashboard';if(!isLoggedIn()){showLogin();return;}showMain();document.getElementById('page-title').textContent=routeTitles[route]||'';document.querySelectorAll('.nav-item').forEach(e=>{if(e.dataset.route===route){e.classList.add('bg-gray-100','dark:bg-gray-900','text-gray-900','dark:text-gray-100','font-medium');e.classList.remove('text-gray-600','dark:text-gray-400');}else{e.classList.remove('bg-gray-100','dark:bg-gray-900','text-gray-900','dark:text-gray-100','font-medium');e.classList.add('text-gray-600','dark:text-gray-400');}});const c=document.getElementById('page-content');c.innerHTML='<div class="page-enter"><p class="text-gray-400 text-sm">加载中...</p></div>';renderPage(route).then(html=>{c.innerHTML='<div class="page-enter">'+html+'</div>';closeSidebar();if(typeof pageInit==='function')pageInit(route);}).catch(e=>{c.innerHTML='<div class="page-enter"><p class="text-red-400 text-sm">'+(e.message||'加载失败')+'</p></div>';});}
window.addEventListener('hashchange',navigate);

// ============================================================
// 登录状态
// ============================================================
function isLoggedIn(){return!!localStorage.getItem('tiku-token');}
function showLogin(){document.getElementById('page-login').classList.remove('hidden');document.getElementById('app-main').classList.add('hidden');}
function showMain(){document.getElementById('page-login').classList.add('hidden');document.getElementById('app-main').classList.remove('hidden');}
function logout(){localStorage.removeItem('tiku-token');showLogin();}
document.getElementById('login-form').addEventListener('submit',async(e)=>{e.preventDefault();const pw=document.getElementById('login-password').value;try{const r=await API.post('/api/admin/login',{password:pw});if(r.token){localStorage.setItem('tiku-token',r.token);location.hash='#/dashboard';navigate();}else{toast(r.msg||'登录失败','error');}}catch(err){toast(err.message||'登录失败','error');}});

// ============================================================
// 侧边栏/Toast/模态框
// ============================================================
function openSidebar(){document.getElementById('sidebar').classList.remove('-translate-x-full');document.getElementById('mobile-overlay').classList.remove('hidden');}
function closeSidebar(){if(window.innerWidth<768){document.getElementById('sidebar').classList.add('-translate-x-full');document.getElementById('mobile-overlay').classList.add('hidden');}}
function toast(msg,type='info'){const c=document.getElementById('toast-container');const colors={info:'border-gray-300 dark:border-gray-700 text-gray-700 dark:text-gray-300',success:'border-gray-900 dark:border-gray-100 text-gray-900 dark:text-gray-100',error:'border-red-400 dark:border-red-600 text-red-600 dark:text-red-400'};const el=document.createElement('div');el.className='px-4 py-2.5 bg-white dark:bg-neutral-900 border rounded-lg text-sm shadow-sm '+colors[type]+' overlay-enter';el.textContent=msg;c.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .2s';setTimeout(()=>el.remove(),200);},2500);}
function showModal(title,bodyHTML){document.getElementById('modal-container').innerHTML='<div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 overlay-enter" onclick="if(event.target===this)closeModal()"><div class="bg-white dark:bg-neutral-900 border border-gray-200 dark:border-gray-800 rounded-lg w-full max-w-lg max-h-[85vh] overflow-y-auto page-enter"><div class="flex items-center justify-between px-5 py-3.5 border-b border-gray-200 dark:border-gray-800"><h3 class="text-sm font-medium">'+title+'</h3><button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="p-5">'+bodyHTML+'</div></div></div>';}
function closeModal(){document.getElementById('modal-container').innerHTML='';}
function copyText(t){navigator.clipboard.writeText(t).catch(()=>{});}

// ============================================================
// 页面渲染
// ============================================================
async function renderPage(route){
  switch(route){
    case'dashboard':return await renderDashboard();
    case'questions':return await renderQuestions();
    case'keys':return await renderKeys();
    case'channels':return await renderChannels();
    case'logs':return await renderLogs();
    case'settings':return await renderSettings();
    default:return'<p class="text-gray-500">页面不存在</p>';
  }
}
function pageInit(route){}

// ============================================================
// 仪表盘
// ============================================================
async function renderDashboard(){
  const d=await API.get('/api/admin/dashboard');
  const s=d.stats||{};
  const logs=d.recentLogs||[];
  const types=d.typeDistribution||[];
  const typeLabels={single:'单选题',multiple:'多选题',judgement:'判断题',completion:'填空题'};
  const total=s.totalQuestions||0;
  let typeHTML=types.length>0?types.map(t=>{const pct=total>0?((t.count/total)*100).toFixed(0):0;return'<div><div class="flex justify-between text-xs mb-1"><span class="text-gray-600 dark:text-gray-400">'+(typeLabels[t.type]||t.type||'未知')+'</span><span class="text-gray-400">'+t.count+'</span></div><div class="h-1.5 bg-gray-100 dark:bg-gray-900 rounded-full overflow-hidden"><div class="h-full bg-gray-800 dark:bg-gray-200 rounded-full" style="width:'+pct+'%"></div></div></div>';}).join(''):'<p class="text-xs text-gray-400">暂无数据</p>';
  let logHTML=logs.length>0?logs.map(l=>'<div class="flex items-center justify-between py-2 border-b border-gray-100 dark:border-gray-900 last:border-0"><div class="flex-1 min-w-0 mr-3"><p class="text-sm truncate '+(l.found?'text-gray-700 dark:text-gray-300':'text-gray-400')+'">'+esc(l.question)+'</p><p class="text-xs text-gray-400 mt-0.5">'+(l.fromCache?'缓存命中':l.channel||'AI 生成')+' · '+fmtTime(l.time)+(l.error?' · '+esc(l.error):'')+'</p></div><span class="text-xs px-2 py-0.5 border rounded shrink-0 '+(l.found?'border-gray-300 dark:border-gray-700 text-gray-600 dark:text-gray-400':'border-gray-300 dark:border-gray-700 text-gray-400')+'">'+(l.found?'已找到':'未找到')+'</span></div>').join(''):'<p class="text-xs text-gray-400">暂无搜索记录</p>';
  return '<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6"><div class="border border-gray-200 dark:border-gray-800 rounded-lg p-4"><p class="text-xs text-gray-500 dark:text-gray-400 mb-1.5">题目总数</p><p class="text-2xl font-semibold tracking-tight">'+(s.totalQuestions||0).toLocaleString()+'</p><p class="text-xs text-gray-400 mt-1">今日新增 '+(s.todayNew||0)+'</p></div><div class="border border-gray-200 dark:border-gray-800 rounded-lg p-4"><p class="text-xs text-gray-500 dark:text-gray-400 mb-1.5">缓存命中率</p><p class="text-2xl font-semibold tracking-tight">'+(s.hitRate||'0%')+'</p><p class="text-xs text-gray-400 mt-1">本周</p></div><div class="border border-gray-200 dark:border-gray-800 rounded-lg p-4"><p class="text-xs text-gray-500 dark:text-gray-400 mb-1.5">AI 调用次数</p><p class="text-2xl font-semibold tracking-tight">'+(s.weekAI||0).toLocaleString()+'</p><p class="text-xs text-gray-400 mt-1">本周</p></div><div class="border border-gray-200 dark:border-gray-800 rounded-lg p-4"><p class="text-xs text-gray-500 dark:text-gray-400 mb-1.5">API 请求次数</p><p class="text-2xl font-semibold tracking-tight">'+(s.weekRequests||0).toLocaleString()+'</p><p class="text-xs text-gray-400 mt-1">本周</p></div></div><div class="grid grid-cols-1 lg:grid-cols-3 gap-4"><div class="border border-gray-200 dark:border-gray-800 rounded-lg p-4"><h3 class="text-sm font-medium mb-4">题型分布</h3><div class="space-y-3">'+typeHTML+'</div></div><div class="lg:col-span-2 border border-gray-200 dark:border-gray-800 rounded-lg p-4"><h3 class="text-sm font-medium mb-4">最近搜索</h3><div class="space-y-2.5">'+logHTML+'</div></div></div>';
}

// ============================================================
// 题库管理
// ============================================================
let _qPage=1;
async function renderQuestions(){
  const url=new URL(location.href);url.hash='';const sp=new URLSearchParams(url.search);const search=sp.get('search')||'';const type=sp.get('type')||'';

function showImportModal(){showModal('导入题目','<div class="space-y-4"><div><label class="block text-sm font-medium mb-1.5">格式</label><div class="flex gap-2"><label class="flex items-center gap-1.5 text-sm cursor-pointer"><input type="radio" name="format" value="json" checked> JSON</label><label class="flex items-center gap-1.5 text-sm cursor-pointer"><input type="radio" name="format" value="csv"> CSV</label></div></div><div><label class="block text-sm font-medium mb-1.5">粘贴内容</label><textarea id="import-content" rows="8" placeholder=\'[{"question":"...","answer":"...","type":"single"}]\' class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm font-mono focus:border-gray-900 dark:focus:border-gray-100 transition-colors"></textarea></div><div class="flex justify-end gap-2 pt-2"><button onclick="closeModal()" class="px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg text-sm hover:bg-gray-50 dark:hover:bg-gray-900">取消</button><button onclick="doImport()" class="px-4 py-2 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 rounded-lg text-sm font-medium">导入</button></div></div>');}
async function doImport(){const fmt=document.querySelector('input[name=format]:checked').value;const content=document.getElementById('import-content').value;if(!content.trim()){toast('内容不能为空','error');return;}try{const r=await API.post('/api/admin/questions/import',{format:fmt,content});toast(r.msg||'导入成功','success');closeModal();navigate();}catch(e){toast(e.message,'error');}}
function exportQuestions(){window.open('/api/admin/questions/export?format=json','_blank');}
function showAddQuestionModal(){showModal('添加题目',editQuestionHTML({}));}
async function showEditQuestionModal(id){try{const q=await API.get('/api/admin/questions/'+id);showModal('编辑题目',editQuestionHTML(q));}catch(e){toast(e.message,'error');}}
function editQuestionHTML(q){const safe=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');return '<div class="space-y-4"><div><label class="block text-sm font-medium mb-1.5">题目</label><textarea id="q-question" rows="3" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm focus:border-gray-900 dark:focus:border-gray-100 transition-colors" placeholder="请输入题目内容">'+safe(q.question)+'</textarea></div><div class="grid grid-cols-2 gap-3"><div><label class="block text-sm font-medium mb-1.5">题型</label><select id="q-type" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm"><option value="single" '+(q.type==='single'?'selected':'')+'>单选题</option><option value="multiple" '+(q.type==='multiple'?'selected':'')+'>多选题</option><option value="judgement" '+(q.type==='judgement'?'selected':'')+'>判断题</option><option value="completion" '+(q.type==='completion'?'selected':'')+'>填空题</option></select></div><div><label class="block text-sm font-medium mb-1.5">答案</label><input type="text" id="q-answer" value="'+safe(q.answer)+'" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm font-mono focus:border-gray-900 dark:focus:border-gray-100 transition-colors" placeholder="多选用 # 分隔"></div></div><div><label class="block text-sm font-medium mb-1.5">选项（可选）</label><textarea id="q-options" rows="3" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm focus:border-gray-900 dark:focus:border-gray-100 transition-colors" placeholder="A. 选项一&#10;B. 选项二">'+safe(q.options)+'</textarea></div><div class="flex justify-end gap-2 pt-2"><button onclick="closeModal()" class="px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg text-sm hover:bg-gray-50 dark:hover:bg-gray-900">取消</button><button onclick="saveQuestion('+(q.id?'\''+q.id+'\'':'null')+')" class="px-4 py-2 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 rounded-lg text-sm font-medium">保存</button></div></div>';}
async function saveQuestion(id){const question=document.getElementById('q-question').value.trim();const answer=document.getElementById('q-answer').value.trim();const type=document.getElementById('q-type').value;const options=document.getElementById('q-options').value.trim();if(!question||!answer){toast('题目和答案不能为空','error');return;}try{if(id){await API.put('/api/admin/questions/'+id,{question,answer,type,options});}else{await API.post('/api/admin/questions',{question,answer,type,options});}toast('保存成功','success');closeModal();navigate();}catch(e){toast(e.message,'error');}}
async function delQuestion(id){if(!confirm('确认删除？'))return;try{await API.del('/api/admin/questions/'+id);toast('已删除','info');navigate();}catch(e){toast(e.message,'error');}}

.5 text-gray-500 hidden md:table-cell">使用次数</th><th class="text-left font-medium px-3 py-2.5 text-gray-500 hidden md:table-cell">失败次数</th><th class="text-left font-medium px-3 py-2.5 text-gray-500">状态</th><th class="text-right font-medium px-4 py-2.5 text-gray-500">操作</th></tr></thead><tbody>'+keyRows+'</tbody></table></div></div></div>';
}
let _channelsData=[];
function switchChannelTab(tab){const c=document.getElementById('tab-content-channels'),k=document.getElementById('tab-content-keys'),tc=document.getElementById('tab-channels'),tk=document.getElementById('tab-keys');if(tab==='channels'){c.classList.remove('hidden');k.classList.add('hidden');tc.classList.add('border-gray-900','dark:border-gray-100','text-gray-900','dark:text-gray-100','font-medium');tc.classList.remove('text-gray-500','border-transparent');tk.classList.remove('border-gray-900','dark:border-gray-100','text-gray-900','dark:text-gray-100','font-medium');tk.classList.add('text-gray-500','border-transparent');}else{c.classList.add('hidden');k.classList.remove('hidden');tk.classList.add('border-gray-900','dark:border-gray-100','text-gray-900','dark:text-gray-100','font-medium');tk.classList.remove('text-gray-500','border-transparent');tc.classList.remove('border-gray-900','dark:border-gray-100','text-gray-900','dark:text-gray-100','font-medium');tc.classList.add('text-gray-500','border-transparent');}}
function showCreateChannelModal(){showModal('创建 AI 渠道','<div class="space-y-4"><div><label class="block text-sm font-medium mb-1.5">渠道名称</label><input type="text" id="c-name" placeholder="如：OpenAI 文本" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm focus:border-gray-900 dark:focus:border-gray-100 transition-colors"></div><div class="grid grid-cols-2 gap-3"><div><label class="block text-sm font-medium mb-1.5">类型</label><select id="c-type" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm focus:border-gray-900 dark:focus:border-gray-100"><option value="text">文本模型</option><option value="vision">视觉模型</option></select></div><div><label class="block text-sm font-medium mb-1.5">权重</label><input type="number" id="c-weight" value="1" min="1" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm focus:border-gray-900 dark:focus:border-gray-100 transition-colors"></div></div><div><label class="block text-sm font-medium mb-1.5">API 地址</label><input type="text" id="c-baseurl" value="https://api.openai.com/v1" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm font-mono focus:border-gray-900 dark:focus:border-gray-100 transition-colors"></div><div><label class="block text-sm font-medium mb-1.5">模型名称</label><input type="text" id="c-model" placeholder="如 gpt-4o-mini" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm font-mono focus:border-gray-900 dark:focus:border-gray-100 transition-colors"></div><div class="grid grid-cols-2 gap-3"><div><label class="block text-sm font-medium mb-1.5">Temperature</label><input type="number" id="c-temp" value="0.3" step="0.1" min="0" max="2" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm focus:border-gray-900 dark:focus:border-gray-100 transition-colors"></div><div><label class="block text-sm font-medium mb-1.5">Max Tokens</label><input type="number" id="c-maxtokens" value="2000" min="1" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm focus:border-gray-900 dark:focus:border-gray-100 transition-colors"></div></div><div class="flex justify-end gap-2 pt-2"><button onclick="closeModal()" class="px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg text-sm hover:bg-gray-50 dark:hover:bg-gray-900">取消</button><button onclick="createChannel()" class="px-4 py-2 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 rounded-lg text-sm font-medium">创建</button></div></div>');}
async function createChannel(){const name=document.getElementById('c-name').value;const type=document.getElementById('c-type').value;const base_url=document.getElementById('c-baseurl').value;const model=document.getElementById('c-model').value;const weight=parseInt(document.getElementById('c-weight').value)||1;const temperature=parseFloat(document.getElementById('c-temp').value)||0.3;const max_tokens=parseInt(document.getElementById('c-maxtokens').value)||2000;if(!name||!base_url||!model){toast('请填写完整','error');return;}try{await API.post('/api/admin/channels',{name,type,base_url,model,weight,temperature,max_tokens});toast('渠道已创建','success');closeModal();navigate();}catch(e){toast(e.message,'error');}}
function showEditChannelModal(id){const c=_channelsData.find(x=>x.id===id)||{};showModal('编辑渠道','<div class="space-y-4"><div><label class="block text-sm font-medium mb-1.5">渠道名称</label><input type="text" id="c-name" value="'+esc(c.name||'')+'" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm focus:border-gray-900 dark:focus:border-gray-100 transition-colors"></div><div class="grid grid-cols-2 gap-3"><div><label class="block text-sm font-medium mb-1.5">类型</label><select id="c-type" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm"><option value="text" '+(c.type==='text'?'selected':'')+'>文本模型</option><option value="vision" '+(c.type==='vision'?'selected':'')+'>视觉模型</option></select></div><div><label class="block text-sm font-medium mb-1.5">权重</label><input type="number" id="c-weight" value="'+(c.weight||1)+'" min="1" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm"></div></div><div><label class="block text-sm font-medium mb-1.5">API 地址</label><input type="text" id="c-baseurl" value="'+esc(c.base_url||'')+'" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm font-mono"></div><div><label class="block text-sm font-medium mb-1.5">模型名称</label><input type="text" id="c-model" value="'+esc(c.model||'')+'" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm font-mono"></div><div class="flex items-center gap-2"><input type="checkbox" id="c-enabled" '+(c.enabled?'checked':'')+'><label for="c-enabled" class="text-sm">启用</label></div><div class="flex justify-end gap-2 pt-2"><button onclick="closeModal()" class="px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg text-sm hover:bg-gray-50 dark:hover:bg-gray-900">取消</button><button onclick="updateChannel(\''+c.id+'\')" class="px-4 py-2 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 rounded-lg text-sm font-medium">保存</button></div></div>');}
async function updateChannel(id){const name=document.getElementById('c-name').value;const type=document.getElementById('c-type').value;const base_url=document.getElementById('c-baseurl').value;const model=document.getElementById('c-model').value;const weight=parseInt(document.getElementById('c-weight').value)||1;const enabled=document.getElementById('c-enabled').checked?1:0;try{await API.put('/api/admin/channels/'+id,{name,type,base_url,model,weight,enabled});toast('已保存','success');closeModal();navigate();}catch(e){toast(e.message,'error');}}
async function delChannel(id){if(!confirm('确认删除此渠道及其所有密钥？'))return;try{await API.del('/api/admin/channels/'+id);toast('已删除','info');navigate();}catch(e){toast(e.message,'error');}}
function showCreateChannelKeyModal(){const opts=(_channelsData||[]).map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');showModal('添加密钥','<div class="space-y-4"><div><label class="block text-sm font-medium mb-1.5">所属渠道</label><select id="ck-channel" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm">'+opts+'</select></div><div><label class="block text-sm font-medium mb-1.5">备注名</label><input type="text" id="ck-name" placeholder="如：主力Key" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm"></div><div><label class="block text-sm font-medium mb-1.5">API Key</label><input type="text" id="ck-key" placeholder="sk-..." class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm font-mono"></div><div class="flex justify-end gap-2 pt-2"><button onclick="closeModal()" class="px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg text-sm hover:bg-gray-50 dark:hover:bg-gray-900">取消</button><button onclick="createChannelKey()" class="px-4 py-2 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 rounded-lg text-sm font-medium">添加</button></div></div>');}
async function createChannelKey(){const channel_id=document.getElementById('ck-channel').value;const name=document.getElementById('ck-name').value;const api_key=document.getElementById('ck-key').value;if(!api_key){toast('API Key 不能为空','error');return;}try{await API.post('/api/admin/channels/'+channel_id+'/keys',{api_key,name});toast('密钥已添加','success');closeModal();navigate();}catch(e){toast(e.message,'error');}}
async function resetKey(id){try{await API.post('/api/admin/channel-keys/'+id+'/reset',{});toast('已重置','success');navigate();}catch(e){toast(e.message,'error');}}
async function delChannelKey(id){if(!confirm('确认删除？'))return;try{await API.del('/api/admin/channel-keys/'+id);toast('已删除','info');navigate();}catch(e){toast(e.message,'error');}}

let _logPage=1;
async function renderLogs(){
  const d=await API.get('/api/admin/logs?page='+_logPage+'&size=20');
  const logs=d.data||[];
  const totalPages=Math.ceil((d.total||0)/20);
  const rows=logs.map(l=>'<tr class="border-b border-gray-100 dark:border-gray-900 last:border-0 hover:bg-gray-50 dark:hover:bg-neutral-900/50"><td class="px-4 py-2.5 max-w-xs"><p class="truncate '+(l.found?'text-gray-700 dark:text-gray-300':'text-gray-400')+'">'+esc(l.question)+'</p>'+(l.error?'<p class="text-xs text-red-400 mt-0.5">'+esc(l.error)+'</p>':'')+'<p class="text-xs text-gray-400 xl:hidden mt-0.5">'+fmtTime(l.created_at)+'</p></td><td class="px-3 py-2.5 hidden sm:table-cell text-gray-500 dark:text-gray-400 text-xs">'+(l.from_cache?'缓存命中':'AI 生成')+'</td><td class="px-3 py-2.5 hidden md:table-cell text-gray-400 text-xs">'+(l.ai_channel?esc(l.ai_channel)+' / '+esc(l.ai_model||''):'-')+'</td><td class="px-3 py-2.5 hidden lg:table-cell text-gray-400 text-xs">'+((l.duration_ms||0)>=1000?((l.duration_ms||0)/1000).toFixed(1)+'s':(l.duration_ms||0)+'ms')+'</td><td class="px-3 py-2.5"><span class="text-xs px-1.5 py-0.5 border rounded '+(l.found?'border-gray-300 dark:border-gray-700 text-gray-600 dark:text-gray-400':'border-gray-300 dark:border-gray-700 text-gray-400')+'">'+(l.found?'已找到':'未找到')+'</span></td><td class="px-3 py-2.5 hidden xl:table-cell text-gray-400 text-xs">'+fmtTime(l.created_at)+'</td></tr>').join('');
  return '<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4"><div class="flex items-center gap-2"><select id="log-found" class="px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm"><option value="">全部状态</option><option value="1">已找到</option><option value="0">未找到</option></select><select id="log-cache" class="px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm"><option value="">全部来源</option><option value="1">缓存命中</option><option value="0">AI 生成</option></select></div><button onclick="clearLogs()" class="px-3 py-2 border border-gray-300 dark:border-gray-700 rounded-lg text-sm hover:bg-gray-50 dark:hover:bg-gray-900 text-red-500 transition-colors">清空日志</button></div><div class="border border-gray-200 dark:border-gray-800 rounded-lg overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-neutral-900"><th class="text-left font-medium px-4 py-2.5 text-gray-500">题目</th><th class="text-left font-medium px-3 py-2.5 text-gray-500 hidden sm:table-cell">来源</th><th class="text-left font-medium px-3 py-2.5 text-gray-500 hidden md:table-cell">渠道/模型</th><th class="text-left font-medium px-3 py-2.5 text-gray-500 hidden lg:table-cell">耗时</th><th class="text-left font-medium px-3 py-2.5 text-gray-500">状态</th><th class="text-left font-medium px-3 py-2.5 text-gray-500 hidden xl:table-cell">时间</th></tr></thead><tbody>'+rows+'</tbody></table></div></div><div class="flex items-center justify-between mt-4 text-sm"><span class="text-gray-400">共 '+(d.total||0)+' 条</span><div class="flex items-center gap-1"><button onclick="_logPage='+Math.max(1,_logPage-1)+';navigate()" class="px-2.5 py-1 border border-gray-300 dark:border-gray-700 rounded text-xs '+(_logPage<=1?'text-gray-400 cursor-not-allowed':'hover:bg-gray-50 dark:hover:bg-gray-900')+'">上一页</button><span class="px-3 py-1 text-gray-600 dark:text-gray-400">'+_logPage+' / '+totalPages+'</span><button onclick="_logPage='+(_logPage>=totalPages?totalPages:_logPage+1)+';navigate()" class="px-2.5 py-1 border border-gray-300 dark:border-gray-700 rounded text-xs '+(_logPage>=totalPages?'text-gray-400 cursor-not-allowed':'hover:bg-gray-50 dark:hover:bg-gray-900')+'">下一页</button></div></div>';
}
async function clearLogs(){if(!confirm('确认清空所有日志？'))return;try{await API.del('/api/admin/logs');toast('日志已清空','info');navigate();}catch(e){toast(e.message,'error');}}

async function renderSettings(){
  const d=await API.get('/api/admin/settings');
  const s=d.settings||{};
  return '<div class="max-w-2xl mx-auto space-y-6"><div class="border border-gray-200 dark:border-gray-800 rounded-lg p-5"><h3 class="text-sm font-medium mb-1">管理员密码</h3><p class="text-xs text-gray-400 mb-4">通过 Worker 环境变量 ADMIN_PASSWORD 配置</p><p class="text-xs text-gray-500">当前密码由环境变量设置，如需修改请更新 wrangler.toml 或使用 wrangler secret put ADMIN_PASSWORD</p></div><div class="border border-gray-200 dark:border-gray-800 rounded-lg p-5"><h3 class="text-sm font-medium mb-1">系统提示词</h3><p class="text-xs text-gray-400 mb-4">自定义 AI 答题的系统提示词，留空使用默认</p><textarea id="s-prompt" rows="8" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm font-mono focus:border-gray-900 dark:focus:border-gray-100 transition-colors" placeholder="留空使用默认提示词">'+esc(s.system_prompt||'')+'</textarea><button onclick="savePrompt()" class="mt-3 px-4 py-2 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 rounded-lg text-sm font-medium">保存</button></div><div class="border border-gray-200 dark:border-gray-800 rounded-lg p-5"><h3 class="text-sm font-medium mb-4">通用设置</h3><div class="space-y-4"><div class="flex items-center justify-between"><div><p class="text-sm">日志保留天数</p><p class="text-xs text-gray-400">0 表示永久保留</p></div><input type="number" id="s-logdays" value="'+esc(s.log_retention_days||'30')+'" min="0" class="w-24 px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm text-center"></div><div class="flex items-center justify-between"><div><p class="text-sm">AI 请求超时</p><p class="text-xs text-gray-400">单位：秒</p></div><input type="number" id="s-timeout" value="'+esc(s.ai_timeout||'30')+'" min="5" class="w-24 px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm text-center"></div><div class="flex items-center justify-between"><div><p class="text-sm">Key 失败禁用阈值</p><p class="text-xs text-gray-400">连续失败多少次后禁用</p></div><input type="number" id="s-failthreshold" value="'+esc(s.key_fail_threshold||'3')+'" min="1" class="w-24 px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm text-center"></div><div class="flex items-center justify-between"><div><p class="text-sm">CORS 允许域名</p><p class="text-xs text-gray-400">* 表示允许所有域名</p></div><input type="text" id="s-cors" value="'+esc(s.cors_origins||'*')+'" class="w-40 px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm"></div></div><button onclick="saveSettings()" class="mt-5 px-4 py-2 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 rounded-lg text-sm font-medium">保存设置</button></div><div class="border border-gray-200 dark:border-gray-800 rounded-lg p-5"><h3 class="text-sm font-medium mb-4">站点信息</h3><div class="space-y-3"><div><label class="block text-xs text-gray-500 mb-1">站点名称</label><input type="text" id="s-sitename" value="'+esc(s.site_name||'Tiku-cfw')+'" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm"></div></div><button onclick="saveSiteName()" class="mt-4 px-4 py-2 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 rounded-lg text-sm font-medium">保存</button></div></div>';
}
async function savePrompt(){const system_prompt=document.getElementById('s-prompt').value;try{await API.put('/api/admin/settings',{system_prompt});toast('提示词已保存','success');}catch(e){toast(e.message,'error');}}
async function saveSettings(){const log_retention_days=document.getElementById('s-logdays').value;const ai_timeout=document.getElementById('s-timeout').value;const key_fail_threshold=document.getElementById('s-failthreshold').value;const cors_origins=document.getElementById('s-cors').value;try{await API.put('/api/admin/settings',{log_retention_days,ai_timeout,key_fail_threshold,cors_origins});toast('设置已保存','success');}catch(e){toast(e.message,'error');}}
async function saveSiteName(){const site_name=document.getElementById('s-sitename').value;try{await API.put('/api/admin/settings',{site_name});toast('已保存','success');}catch(e){toast(e.message,'error');}}

// ============================================================
// 工具函数
// ============================================================
function esc(s){return(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fmtTime(s){if(!s)return'';try{const d=new Date(s+'Z');const now=new Date();const diff=(now-d)/1000;if(diff<60)return Math.floor(diff)+' 秒前';if(diff<3600)return Math.floor(diff/60)+' 分钟前';if(diff<86400)return Math.floor(diff/3600)+' 小时前';if(diff<86400*7)return Math.floor(diff/86400)+' 天前';return s.replace('T',' ').slice(0,16);}catch{return s;}}

// ============================================================
// 启动
// ============================================================
navigate();
</script>
