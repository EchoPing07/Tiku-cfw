<!DOCTYPE html>
<html lang="zh-CN" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiku-cfw 管理面板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['system-ui','-apple-system','sans-serif'], mono: ['ui-monospace','SFMono-Regular','monospace'] } } }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    /* 防止 Tailwind CDN 加载前 hidden 类失效导致图标/文本同时可见 */
    .hidden { display: none !important; }
    body { font-feature-settings: "kern"; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    .dark ::-webkit-scrollbar-thumb { background: #4b5563; }
    .theme-transition, .theme-transition * { transition: background-color .2s, border-color .2s, color .2s; }
    .page-enter { animation: pageEnter .15s ease-out; }
    @keyframes pageEnter { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
    .overlay-enter { animation: overlayEnter .2s ease-out; }
    @keyframes overlayEnter { from{opacity:0} to{opacity:1} }
    .sidebar-enter { animation: sidebarEnter .2s ease-out; }
    @keyframes sidebarEnter { from{transform:translateX(-100%)} to{transform:translateX(0)} }
    input:focus,select:focus,textarea:focus { outline:none; }
    input[type="checkbox"] { accent-color:#111827; }
    .dark input[type="checkbox"] { accent-color:#f3f4f6; }
    /* ===== 组件样式（借鉴 shadcn/Buddy 极简风格） ===== */
    .tnum { font-variant-numeric: tabular-nums; }
    .metric-value { font-size:24px; font-weight:600; letter-spacing:-.02em; line-height:30px; font-variant-numeric:tabular-nums; }
    .badge { display:inline-flex; align-items:center; height:20px; padding:0 8px; border-radius:9999px; font-size:11px; font-weight:500; line-height:1; white-space:nowrap; cursor:default; }
    .badge-ok { background:rgba(22,163,74,.09); color:#15803d; }
    .dark .badge-ok { background:rgba(74,222,128,.13); color:#4ade80; }
    .badge-err { background:rgba(220,38,38,.08); color:#dc2626; }
    .dark .badge-err { background:rgba(248,113,113,.13); color:#f87171; }
    .badge-warn { background:rgba(217,119,6,.1); color:#b45309; }
    .dark .badge-warn { background:rgba(251,191,36,.13); color:#fbbf24; }
    .badge-muted { background:rgba(107,114,128,.1); color:#6b7280; }
    .dark .badge-muted { background:rgba(156,163,175,.13); color:#9ca3af; }
    .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:28px 0; color:#9ca3af; font-size:12px; }
    input[type="checkbox"].switch { position:relative; width:34px; height:19px; border-radius:9999px; background:#d1d5db; cursor:pointer; transition:background .2s; appearance:none; -webkit-appearance:none; flex-shrink:0; outline:none; }
    .dark input[type="checkbox"].switch { background:#374151; }
    input[type="checkbox"].switch::after { content:""; position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:9999px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .2s; }
    input[type="checkbox"].switch:checked { background:#111827; }
    .dark input[type="checkbox"].switch:checked { background:#e5e7eb; }
    input[type="checkbox"].switch:checked::after { transform:translateX(15px); }
    /* 趋势图（SVG） */
    .tbar { fill:rgba(107,114,128,.28); transition:fill .15s; }
    .tbar:hover { fill:rgba(107,114,128,.55); }
    .dark .tbar { fill:rgba(156,163,175,.24); }
    .dark .tbar:hover { fill:rgba(156,163,175,.5); }
    .tline { fill:none; stroke:currentColor; stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round; }
    .tdot { fill:currentColor; }
    .tlabel { fill:#9ca3af; font-size:10px; font-family:system-ui,sans-serif; }
    /* 用量进度条 */
    .usage-track { height:6px; border-radius:9999px; background:rgba(107,114,128,.14); overflow:hidden; }
    .dark .usage-track { background:rgba(156,163,175,.14); }
    .usage-fill { height:100%; border-radius:9999px; background:currentColor; opacity:.75; transition:width .4s; }
    .spin { display:inline-block; width:14px; height:14px; border:2px solid rgba(107,114,128,.3); border-top-color:#6b7280; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    pre.raw { font-size:11px; line-height:1.5; }
  </style>
  <script>
    // 防止主题闪烁：在页面渲染前应用深色模式类
    (function(){
      var t=localStorage.getItem('tiku-theme')||'auto';
      var d=t==='dark'||(t==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
      if(d)document.documentElement.classList.add('dark');
    })();
  </script>
</head>

<script>
// ============================================================
// API 封装
// ============================================================
const API = {
  async request(path, options = {}) {
    const token = localStorage.getItem('tiku-token');
    const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(path, { ...options, headers });
    if (res.status === 401) { logout(); throw new Error('登录已过期'); }
    const data = await res.json().catch(() => ({}));
    // 业务失败（code 存在且不为 1）：抛出 msg，避免被调用方当作成功处理
    if (data && typeof data === 'object' && data.code !== undefined && data.code !== 1) {
      throw new Error(data.msg || '请求失败');
    }
    return data;
  },
  get(path) { return this.request(path); },
  post(path, data) { return this.request(path, { method: 'POST', body: JSON.stringify(data) }); },
  put(path, data) { return this.request(path, { method: 'PUT', body: JSON.stringify(data) }); },
  del(path) { return this.request(path, { method: 'DELETE' }); },
};

// ============================================================
// 主题管理
// ============================================================
function getStoredTheme(){return localStorage.getItem('tiku-theme')||'auto';}
function applyTheme(t){const d=t==='dark'||(t==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);document.querySelectorAll('.theme-icon-light').forEach(e=>e.classList.toggle('hidden',!d));document.querySelectorAll('.theme-icon-dark').forEach(e=>e.classList.toggle('hidden',d));document.querySelectorAll('.theme-text-light').forEach(e=>e.classList.toggle('hidden',!d));document.querySelectorAll('.theme-text-dark').forEach(e=>e.classList.toggle('hidden',d));}
function toggleTheme(){const d=document.documentElement.classList.contains('dark');const n=d?'light':'dark';localStorage.setItem('tiku-theme',n);applyTheme(n);}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(getStoredTheme()==='auto')applyTheme('auto');});
applyTheme(getStoredTheme());

// ============================================================
// 站点名称管理
// ============================================================
let siteName=localStorage.getItem('tiku-site-name')||'Tiku-cfw';
function applySiteName(name){siteName=(name||'Tiku-cfw').trim()||'Tiku-cfw';localStorage.setItem('tiku-site-name',siteName);document.title=siteName+' 管理面板';document.querySelectorAll('.site-name').forEach(e=>e.textContent=siteName);}
applySiteName(siteName);

// ============================================================
// 统计时区（服务端设置同步，默认北京时间 UTC+8）
// ============================================================
let _tzMin=parseInt(localStorage.getItem('tiku-tz')||'')||480;
function applyTzOffset(v){const n=parseInt(v,10);_tzMin=(Number.isFinite(n)&&n>=-720&&n<=840)?n:480;localStorage.setItem('tiku-tz',String(_tzMin));}
function tzLabelJs(min){const s=min<0?'-':'+';const a=Math.abs(min);const h=Math.floor(a/60);const m=a%60;return 'UTC'+s+h+(m?':'+String(m).padStart(2,'0'):'');}

// ============================================================
// 路由
// ============================================================
const routes=['dashboard','questions','debug','keys','channels','logs','settings'];
const routeTitles={dashboard:'仪表盘',questions:'题库管理',debug:'在线搜题',keys:'题库密钥',channels:'模型列表',logs:'搜索日志',settings:'系统设置'};
function navigate(){const hash=location.hash.slice(2)||'dashboard';const route=routes.includes(hash)?hash:'dashboard';if(!isLoggedIn()){showLogin();return;}showMain();document.getElementById('page-title').textContent=routeTitles[route]||'';document.querySelectorAll('.nav-item').forEach(e=>{if(e.dataset.route===route){e.classList.add('bg-gray-100','dark:bg-gray-900','text-gray-900','dark:text-gray-100','font-medium');e.classList.remove('text-gray-600','dark:text-gray-400');}else{e.classList.remove('bg-gray-100','dark:bg-gray-900','text-gray-900','dark:text-gray-100','font-medium');e.classList.add('text-gray-600','dark:text-gray-400');}});const c=document.getElementById('page-content');c.innerHTML='<div class="page-enter"><p class="text-gray-400 text-sm">加载中...</p></div>';renderPage(route).then(html=>{c.innerHTML='<div class="page-enter">'+html+'</div>';closeSidebar();if(typeof pageInit==='function')pageInit(route);}).catch(e=>{c.innerHTML='<div class="page-enter"><p class="text-red-400 text-sm">'+(e.message||'加载失败')+'</p></div>';});}
window.addEventListener('hashchange',navigate);

// ============================================================
// 登录状态
// ============================================================
function isLoggedIn(){return!!localStorage.getItem('tiku-token');}
function showLogin(){document.getElementById('page-login').classList.remove('hidden');document.getElementById('app-main').classList.add('hidden');}
function showMain(){document.getElementById('page-login').classList.add('hidden');document.getElementById('app-main').classList.remove('hidden');}
function logout(){localStorage.removeItem('tiku-token');showLogin();}
document.getElementById('login-form').addEventListener('submit',async(e)=>{e.preventDefault();const pw=document.getElementById('login-password').value;try{const r=await API.post('/api/admin/login',{password:pw});if(r.token){localStorage.setItem('tiku-token',r.token);location.hash='#/dashboard';navigate();}else{toast(r.msg||'登录失败','error');}}catch(err){toast(err.message||'登录失败','error');}});

// ============================================================
// 侧边栏/Toast/模态框
// ============================================================
function openSidebar(){document.getElementById('sidebar').classList.remove('-translate-x-full');document.getElementById('mobile-overlay').classList.remove('hidden');}
function closeSidebar(){if(window.innerWidth<768){document.getElementById('sidebar').classList.add('-translate-x-full');document.getElementById('mobile-overlay').classList.add('hidden');}}
function toast(msg,type='info'){const c=document.getElementById('toast-container');const colors={info:'border-gray-300 dark:border-gray-700 text-gray-700 dark:text-gray-300',success:'border-gray-900 dark:border-gray-100 text-gray-900 dark:text-gray-100',error:'border-red-400 dark:border-red-600 text-red-600 dark:text-red-400'};const el=document.createElement('div');el.className='px-4 py-2.5 bg-white dark:bg-neutral-900 border rounded-lg text-sm shadow-sm '+colors[type]+' overlay-enter';el.textContent=msg;c.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .2s';setTimeout(()=>el.remove(),200);},2500);}

function metricCard(label,value,detail){return '<div class="border border-gray-200 dark:border-gray-800 rounded-lg p-4"><p class="text-xs text-gray-500 dark:text-gray-400 mb-1.5">'+label+'</p><p class="metric-value">'+value+'</p><p class="text-xs text-gray-400 mt-1 truncate">'+(detail||'')+'</p></div>';}
function trendChartSVG(rows){
  if(!rows||rows.length===0)return '<div class="empty">暂无趋势数据</div>';
  const W=760,H=176,PT=10,PB=20,PL=6,PR=6;
  const iw=W-PL-PR,ih=H-PT-PB;
  const maxReq=Math.max.apply(null,rows.map(r=>r.req||0).concat([1]));
  const maxTok=Math.max.apply(null,rows.map(r=>r.tokens||0).concat([1]));
  const n=rows.length;
  const x=i=>PL+(i+0.5)*(iw/n);
  const bw=Math.max(4,Math.min(26,iw/n*0.55));
  let bars='',labels='',dots='';
  const pts=[];
  rows.forEach((r,i)=>{
    const v=r.req||0;
    const bh=v>0?Math.max(3,v/maxReq*ih):0;
    bars+='<rect x="'+(x(i)-bw/2).toFixed(1)+'" y="'+(PT+ih-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" class="tbar"><title>'+r.d+'  请求 '+v+' · AI '+(r.ai||0)+' · Tokens '+fmtTokens(r.tokens||0)+'</title></rect>';
    const ty=PT+ih-((r.tokens||0)/maxTok)*ih;
    pts.push([x(i),Math.max(PT,Math.min(PT+ih,ty))]);
    const step=Math.ceil(n/7);
    if(i%step===0||i===n-1)labels+='<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" class="tlabel">'+r.d.slice(5)+'</text>';
  });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  dots=pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.2" class="tdot"/>').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" class="w-full" style="aspect-ratio:760/176;height:auto">'+bars+'<path d="'+line+'" class="tline"/>'+dots+labels+'</svg>';
}

  // 模型用量（近 7 天）
  const usage=d.channelUsage||[];

  const usageHTML=usage.length>0?usage.map(u=>{const sr=u.requests>0?Math.round(u.success/u.requests*100):0;return '<div class="py-2"><div class="flex items-center justify-between text-xs mb-1 gap-2"><span class="text-gray-700 dark:text-gray-300 truncate">'+esc(u.name)+'</span><span class="text-gray-400 tnum shrink-0">'+u.requests+' 次 · '+fmtTokens(u.tokens)+' tok · '+fmtMs(u.avgMs)+' · <span class="'+(sr>=95?'text-green-600 dark:text-green-400':'text-amber-600 dark:text-amber-400')+'">'+sr+'%</span></span></div><div class="usage-track"><div class="usage-fill" style="width:'+Math.round(u.requests/maxReq*100)+'%"></div></div></div>';}).join(''):'<div class="empty">近 7 天暂无 AI 调用</div>';
  // 模型/API Key 概况
  const chSum=d.channelSummary||{};
  const chs=chSum.channels||[];
  const sumBy=t=>{const r=chs.find(c=>c.type===t);return r?(r.enabled||0)+'/'+r.total:'0/0';};
  const ks=chSum.keys||{};
  const tokenHint=s.tokensAvailable===false?' <span class="badge badge-warn">Token 统计未启用 · 运行迁移 0005</span>':'';
  return '<div class="flex items-center justify-between mb-5 gap-2"><p class="text-xs text-gray-400">统计口径：今日 / 近 7 天（'+((d.timezone&&d.timezone.label)||'UTC+8')+'）</p><button onclick="navigate()" class="px-3 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg text-xs hover:bg-gray-50 dark:hover:bg-gray-900 transition-colors">刷新</button></div>'
  +'<div class="flex items-center justify-between mb-3"><h3 class="section-title">题库查询</h3></div>'
  +'<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6">'
  +metricCard('题目总数',(s.totalQuestions||0).toLocaleString(),'今日新增 '+(s.todayNew||0))
  +metricCard('今日查询',(s.todayRequests||0).toLocaleString(),'缓存命中 '+(s.todayCached||0)+' · AI '+(s.todayAI||0))
  +metricCard('7 天查询',(s.weekRequests||0).toLocaleString(),'缓存命中 '+(s.weekCached||0)+' · AI 生成 '+(s.weekAI||0)+' · 失败 '+((s.weekRequests||0)-(s.weekCached||0)-(s.weekAI||0)))
  +metricCard('7 天命中率',s.hitRate||'0%','今日 '+(s.todayHitRate||'0%'))
  +'</div>'
  +'<div class="flex items-center justify-between mb-3 gap-2 flex-wrap"><h3 class="section-title">Token 用量</h3><span class="text-xs text-gray-400">文本 '+sumBy('text')+' · 视觉 '+sumBy('vision')+' · API Key '+(ks.enabled||0)+'/'+(ks.total||0)+' 可用'+tokenHint+'</span></div>'
  +'<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-4">'
  +metricCard('今日 Tokens',fmtTokens(tToday.total),'输入 '+fmtTokens(tToday.prompt)+' · 输出 '+fmtTokens(tToday.completion))
  +metricCard('7 天 Tokens',fmtTokens(tWeek.total),'输入 '+fmtTokens(tWeek.prompt)+' · 输出 '+fmtTokens(tWeek.completion))
  +metricCard('7 天 AI 调用',(s.weekAI||0).toLocaleString(),'今日 '+(s.todayAI||0)+' 次')
  +metricCard('AI 平均耗时',fmtMs(s.avgAiLatencyMs||0),'每题平均 '+fmtTokens(s.avgTokensPerAI||0)+' tokens')
  +'</div>'
  +'<div class="border border-gray-200 dark:border-gray-800 rounded-lg p-4 mb-6"><h3 class="text-sm font-medium mb-2">模型用量 · 近 7 天</h3>'+usageHTML+'</div>'
  +'<div class="border border-gray-200 dark:border-gray-800 rounded-lg p-4 mb-6"><div class="flex items-center justify-between mb-3"><h3 class="text-sm font-medium">近 14 天趋势</h3><div class="flex items-center gap-4 text-xs text-gray-400"><span class="flex items-center gap-1.5"><span class="inline-block w-2.5 h-2.5 rounded-sm" style="background:rgba(107,114,128,.35)"></span>请求</span><span class="flex items-center gap-1.5"><span class="inline-block w-4 h-0.5 bg-current rounded"></span>Tokens</span></div></div>'+trendChartSVG(d.trend||[])+'</div>'
  +'<div class="grid grid-cols-1 lg:grid-cols-3 gap-4"><div class="border border-gray-200 dark:border-gray-800 rounded-lg p-4"><h3 class="text-sm font-medium mb-4">题型分布</h3><div class="space-y-3">'+typeHTML+'</div></div><div class="border border-gray-200 dark:border-gray-800 rounded-lg p-4"><h3 class="text-sm font-medium mb-4">最近搜索</h3><div class="space-y-2.5">'+logHTML+'</div></div><div class="border border-gray-200 dark:border-gray-800 rounded-lg p-4"><h3 class="text-sm font-medium mb-4">最近错误 · 近 7 天</h3><div>'+errHTML+'</div></div></div>';
}

async function doDebugSearch(){
  const title=document.getElementById('dbg-title').value.trim();
  if(!title){toast('题目不能为空','error');return;}
  const btn=document.getElementById('dbg-btn');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>&nbsp;搜索中…';
  try{
    const r=await API.post('/api/admin/debug/search',{title,type:document.getElementById('dbg-type').value||undefined,options:document.getElementById('dbg-options').value.trim()||undefined,images:document.getElementById('dbg-images').value.split('\n').map(s=>s.trim()).filter(Boolean)});

function renderDebugResult(r){
  const box=document.getElementById('dbg-result');

  const fmtJSON=s=>{if(!s)return '<p class="text-xs text-gray-400">无</p>';try{return '<pre class="raw font-mono text-gray-600 dark:text-gray-400 bg-gray-50 dark:bg-neutral-900 p-3 rounded overflow-x-auto whitespace-pre-wrap break-all">'+esc(JSON.stringify(JSON.parse(s),null,2))+'</pre>';}catch{return '<pre class="raw font-mono text-gray-600 dark:text-gray-400 bg-gray-50 dark:bg-neutral-900 p-3 rounded overflow-x-auto whitespace-pre-wrap break-all">'+esc(s)+'</pre>';}};
  box.innerHTML='<div class="border border-gray-200 dark:border-gray-800 rounded-lg p-5 page-enter space-y-4">'
  +'<div class="flex items-center gap-2 flex-wrap"><span class="badge '+(r.found?'badge-ok':'badge-err')+'">'+(r.found?'已找到':'未找到')+'</span><span class="badge badge-muted">'+(r.fromCache?'缓存命中':'AI 生成')+'</span>'+(r.channel?'<span class="badge badge-muted">'+esc(r.channel)+'</span>':'')+(r.model?'<span class="badge badge-muted">'+esc(r.model)+'</span>':'')+'<span class="text-xs text-gray-400 tnum ml-1">'+fmtMs(r.durationMs||0)+' · Tokens '+usage+'</span></div>'
  +(r.answer?'<div><span class="text-xs text-gray-400 block mb-1">答案</span><p class="text-sm font-mono text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-neutral-900 border border-gray-100 dark:border-gray-800 rounded-lg p-3 whitespace-pre-wrap break-all">'+esc(r.answer)+'</p></div>':'')
  +(r.error?'<div><span class="text-xs text-gray-400 block mb-1">错误</span><p class="text-sm text-red-500 break-all">'+esc(r.error)+'</p></div>':'')
  +'<details><summary class="cursor-pointer text-xs text-gray-500 dark:text-gray-400">AI 原始请求</summary><div class="mt-2">'+fmtJSON(r.rawRequest)+'</div></details>'
  +'<details><summary class="cursor-pointer text-xs text-gray-500 dark:text-gray-400">AI 原始响应</summary><div class="mt-2">'+fmtJSON(r.rawResponse)+'</div></details>'
  +'</div>';

    toast(r.ok?'连接正常':'测试失败：'+(r.msg||'全部 API Key 不可用'),r.ok?'success':'error');
  }catch(e){
    if(box)box.innerHTML='<div class="mt-3 pt-2 border-t border-gray-100 dark:border-gray-900"><p class="text-xs text-red-500">'+esc(e.message)+'</p></div>';

  return '<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4"><div class="flex items-center gap-2"><select id="log-found" onchange="_logFound=this.value;_logPage=1;navigate()" class="px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm"><option value=""'+(_logFound===''?' selected':'')+'>全部状态</option><option value="1"'+(_logFound==='1'?' selected':'')+'>已找到</option><option value="0"'+(_logFound==='0'?' selected':'')+'>未找到</option></select><select id="log-cache" onchange="_logCache=this.value;_logPage=1;navigate()" class="px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm"><option value=""'+(_logCache===''?' selected':'')+'>全部来源</option><option value="1"'+(_logCache==='1'?' selected':'')+'>缓存命中</option><option value="0"'+(_logCache==='0'?' selected':'')+'>AI 生成</option></select></div><button onclick="clearLogs()" class="px-3 py-2 border border-gray-300 dark:border-gray-700 rounded-lg text-sm hover:bg-gray-50 dark:hover:bg-gray-900 text-red-500 transition-colors">清空日志</button></div><div class="border border-gray-200 dark:border-gray-800 rounded-lg overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-neutral-900"><th class="text-left font-medium px-4 py-2.5 text-gray-500">题目</th><th class="text-left font-medium px-3 py-2.5 text-gray-500 hidden sm:table-cell">来源</th><th class="text-left font-medium px-3 py-2.5 text-gray-500 hidden md:table-cell">模型</th><th class="text-left font-medium px-3 py-2.5 text-gray-500 hidden lg:table-cell">耗时</th><th class="text-left font-medium px-3 py-2.5 text-gray-500 hidden lg:table-cell">Tokens</th><th class="text-left font-medium px-3 py-2.5 text-gray-500">状态</th><th class="text-left font-medium px-3 py-2.5 text-gray-500 hidden xl:table-cell">时间</th><th class="text-right font-medium px-4 py-2.5 text-gray-500">操作</th></tr></thead><tbody>'+rows+'</tbody></table></div></div><div class="flex items-center justify-between mt-4 text-sm"><span class="text-gray-400">共 '+(d.total||0)+' 条</span><div class="flex items-center gap-1"><button onclick="_logPage='+Math.max(1,_logPage-1)+';navigate()" class="px-2.5 py-1 border border-gray-300 dark:border-gray-700 rounded text-xs '+(_logPage<=1?'text-gray-400 cursor-not-allowed':'hover:bg-gray-50 dark:hover:bg-gray-900')+'">上一页</button><span class="px-3 py-1 text-gray-600 dark:text-gray-400">'+_logPage+' / '+totalPages+'</span><button onclick="_logPage='+(_logPage>=totalPages?totalPages:_logPage+1)+';navigate()" class="px-2.5 py-1 border border-gray-300 dark:border-gray-700 rounded text-xs '+(_logPage>=totalPages?'text-gray-400 cursor-not-allowed':'hover:bg-gray-50 dark:hover:bg-gray-900')+'">下一页</button></div></div>';

function showLogDetail(id){const l=_logsData.find(x=>x.id===id)||{};const fmtJSON=(s)=>{if(!s)return '<p class="text-xs text-gray-400">无</p>';try{return '<pre class="raw font-mono text-gray-600 dark:text-gray-400 bg-gray-50 dark:bg-neutral-900 p-3 rounded overflow-x-auto whitespace-pre-wrap break-all">'+esc(JSON.stringify(JSON.parse(s),null,2))+'</pre>';}catch{return '<pre class="raw font-mono text-gray-600 dark:text-gray-400 bg-gray-50 dark:bg-neutral-900 p-3 rounded overflow-x-auto whitespace-pre-wrap break-all">'+esc(s)+'</pre>';}};showModal('日志详情','<div class="space-y-4"><div class="flex items-center gap-2 flex-wrap"><span class="badge '+(l.found?'badge-ok':'badge-err')+'">'+(l.found?'已找到':'未找到')+'</span><span class="badge badge-muted">'+(l.from_cache?'缓存命中':'AI 生成')+'</span>'+(l.ai_channel?'<span class="badge badge-muted">'+esc(l.ai_channel)+(l.ai_model?' / '+esc(l.ai_model):'')+'</span>':'')+'</div><div class="grid grid-cols-2 gap-3 text-sm"><div><span class="text-gray-400 text-xs">耗时</span><p class="text-gray-700 dark:text-gray-300">'+fmtMs(l.duration_ms||0)+'</p></div><div><span class="text-gray-400 text-xs">Tokens</span><p class="text-gray-700 dark:text-gray-300 tnum">'+(l.total_tokens!=null?('输入 '+fmtTokens(l.prompt_tokens)+' · 输出 '+fmtTokens(l.completion_tokens)+' · 合计 '+fmtTokens(l.total_tokens)):'—')+'</p></div></div><div><span class="text-xs text-gray-400">题目</span><p class="text-sm text-gray-700 dark:text-gray-300 mt-1">'+esc(l.question)+'</p></div>'+(l.answer?'<div><span class="text-xs text-gray-400">答案</span><p class="text-sm font-mono text-gray-700 dark:text-gray-300 mt-1">'+esc(l.answer)+'</p></div>':'')+(l.error?'<div><span class="text-xs text-gray-400">错误</span><p class="text-sm text-red-500 mt-1">'+esc(l.error)+'</p></div>':'')+'<div><span class="text-xs text-gray-400 block mb-1">AI 请求</span>'+fmtJSON(l.ai_request)+'</div><div><span class="text-xs text-gray-400 block mb-1">AI 响应</span>'+fmtJSON(l.ai_response)+'</div><div class="flex justify-end pt-3 border-t border-gray-100 dark:border-gray-900"><button onclick="correctAnswerFromLog(\''+esc(l.question_hash||'')+'\')" class="px-4 py-2 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 rounded-lg text-sm font-medium hover:bg-gray-700 dark:hover:bg-gray-300 transition-colors">纠正缓存答案</button></div></div>');}
async function correctAnswerFromLog(hash){
  if(!hash){toast('日志缺少题目哈希（旧数据）','error');return;}
  try{
    const r=await API.get('/api/admin/questions/by-hash/'+encodeURIComponent(hash));
    const q=r.question;
    if(!q){toast('该题未缓存（AI 未成功生成过答案）','info');return;}
    showModal('纠正缓存答案','<div class="space-y-4"><div><span class="text-xs text-gray-400">题目</span><p class="text-sm text-gray-700 dark:text-gray-300 mt-1">'+esc(q.question)+'</p></div><div><label class="block text-sm font-medium mb-1.5">正确答案</label><input type="text" id="fix-answer" value="'+esc(q.answer)+'" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm font-mono focus:border-gray-900 dark:focus:border-gray-100 transition-colors" placeholder="多选用 # 分隔"></div><div><label class="block text-sm font-medium mb-1.5">题型</label><select id="fix-type" class="w-full px-3 py-2 bg-transparent border border-gray-300 dark:border-gray-700 rounded-lg text-sm"><option value=""'+(q.type?'':' selected')+'>不修改</option><option value="single"'+(q.type==='single'?' selected':'')+'>单选题</option><option value="multiple"'+(q.type==='multiple'?' selected':'')+'>多选题</option><option value="judgement"'+(q.type==='judgement'?' selected':'')+'>判断题</option><option value="completion"'+(q.type==='completion'?' selected':'')+'>填空题</option></select></div><div class="flex justify-end gap-2 pt-2"><button onclick="closeModal()" class="px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg text-sm hover:bg-gray-50 dark:hover:bg-gray-900">取消</button><button onclick="saveCorrectedAnswer(\''+q.id+'\')" class="px-4 py-2 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 rounded-lg text-sm font-medium">保存</button></div></div>');
  }catch(e){toast(e.message,'error');}
}
async function saveCorrectedAnswer(id){const answer=document.getElementById('fix-answer').value.trim();if(!answer){toast('答案不能为空','error');return;}try{await API.put('/api/admin/questions/'+id,{answer,type:document.getElementById('fix-type').value||undefined});toast('答案已纠正','success');closeModal();}catch(e){toast(e.message,'error');}}

        +sRow('Key 失败禁用阈值','<input type="number" id="s-failthreshold" value="'+esc(s.key_fail_threshold||'3')+'" min="1" class="'+S_INPUT+'">','连续失败多少次后禁用')
      +'</div>'
      +sRow('系统提示词','<textarea id="s-prompt" rows="6" placeholder="留空使用默认提示词" class="w-full px-3 py-2 bg-white dark:bg-neutral-950 border border-gray-300 dark:border-gray-700 rounded-lg text-sm font-mono focus:border-gray-400 dark:focus:border-gray-500 focus:ring-[3px] focus:ring-gray-200/80 dark:focus:ring-gray-800 transition-shadow">'+esc(s.system_prompt||'')+'</textarea>','自定义 AI 答题的系统提示词')
    +'</div>')
    +sCard('日志','<div class="space-y-3.5">'
      +sRow('日志保留天数','<input type="number" id="s-logdays" value="'+esc(s.log_retention_days||'30')+'" min="0" class="'+S_INPUT+'">','0 表示永久保留，过期日志每日定时清理')
    +'</div>')
  +'</div>';
  return head+'<div class="grid grid-cols-1 lg:grid-cols-2 gap-3 items-start">'+left+right+'</div>';
}
async function saveAllSettings(){
  const btn=document.getElementById('s-save-btn');if(!btn)return;
  const orig=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span>保存中…';
  const g=id=>document.getElementById(id).value;
  const payload={site_name:g('s-sitename').trim(),timezone_offset:g('s-tz'),cors_origins:g('s-cors').trim(),ai_timeout:g('s-timeout'),key_fail_threshold:g('s-failthreshold'),log_retention_days:g('s-logdays'),system_prompt:g('s-prompt')};
  try{await API.put('/api/admin/settings',payload);applyTzOffset(payload.timezone_offset);applySiteName(payload.site_name);toast('设置已保存','success');}
  catch(e){toast(e.message,'error');}
  finally{btn.disabled=false;btn.innerHTML=orig;}
}

// ============================================================
// 工具函数
// ============================================================
function esc(s){return(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fmtTime(s){if(!s)return'';try{const iso=s.includes('T')?s:s.replace(' ','T')+'Z';const d=new Date(iso);const now=new Date();const diff=(now-d)/1000;if(diff<60)return Math.floor(diff)+' 秒前';if(diff<3600)return Math.floor(diff/60)+' 分钟前';if(diff<86400)return Math.floor(diff/3600)+' 小时前';if(diff<86400*7)return Math.floor(diff/86400)+' 天前';const loc=new Date(d.getTime()+_tzMin*60000);return loc.toISOString().slice(0,16).replace('T',' ');}catch{return s;}}
function fmtTokens(n){if(n==null)return '—';if(n>=1e6)return (n/1e6).toFixed(1)+'M';if(n>=1e3)return (n/1e3).toFixed(1)+'k';return String(n);}
function fmtMs(ms){ms=ms||0;return ms>=1000?(ms/1000).toFixed(1)+'s':ms+'ms';}

// ============================================================
// 启动
// ============================================================
// 已登录时从服务端同步最新站点名称与统计时区
if(isLoggedIn()){API.get('/api/admin/settings').then(d=>{applySiteName((d.settings||{}).site_name);applyTzOffset((d.settings||{}).timezone_offset);}).catch(()=>{});}
navigate();
</script>
