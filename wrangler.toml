name = "tiku-cfw"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "tiku-cfw-db"
database_id = "YOUR_D1_DATABASE_ID"

# 环境变量（敏感信息请用 wrangler secret put 设置）
[vars]
JWT_SECRET = "change-me-in-production"
ADMIN_PASSWORD = "password"

# 前端静态资源
[assets]
directory = "./src/web"
binding = "ASSETS"

# 本地开发配置
[dev]
port = 8787
local_protocol = "http"
